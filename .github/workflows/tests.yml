# À placer dans .github/workflows/tests.yml (le jeton actuel n'a pas le droit « workflow » : à faire par le créateur).
name: tests
on: [push, pull_request]
concurrency: { group: tests-${{ github.ref }}, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  rapides:                       # ~30 s : tests unitaires + data.json (ordre et index i préservés)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/
      - run: |
          git show HEAD~1:data.json > /tmp/old.json 2>/dev/null || echo '[]' > /tmp/old.json
          python3 tests/check_data.py . /tmp/old.json
  navigateurs:                   # ~3-5 min : Playwright Chromium + WebKit, médias muets locaux, aucun accès Hugging Face
    needs: rapides
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.62.0
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.62.0-${{ runner.os }} }
      - run: python -m playwright install --with-deps chromium webkit
      - run: QA_BUDGET=600 python tests/e2e/run_all.py --quick
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-banc
          path: |
            tests/e2e/rapport.md
            tests/e2e/shots/
          retention-days: 7

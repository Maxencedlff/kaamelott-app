  <title>Kaamelott</title>
  <!-- premier écran identique à l'image de lancement : noir dès le premier octet, sans attendre style.css -->
  <style>
    html.launching, html.launching body { background: #000; }
    .launch { position: fixed; inset: 0; z-index: 100; background: #000; transition: opacity .25s cubic-bezier(.25,.1,.25,1); }
    .launch.out { opacity: 0; pointer-events: none; }
    .launch-k { position: absolute; left: 50%; top: var(--kc, 50%); height: 64px; width: auto; transform: translate(-50%, -50%); }
    .launch-slow { position: absolute; left: 0; right: 0; top: calc(var(--kc, 50%) + 64px); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transition: opacity .3s; }
    .launch-slow.on { opacity: 1; }
    .launch-slow .rail { width: 120px; height: 3px; border-radius: 1.5px; background: #2c2c2e; }
    .launch-slow .rail i { background: #8e8e93; }
    .launch-slow .m { font-size: 13px; color: #8e8e93; font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) { .launch { transition-duration: .12s; } }
  </style>
  <!-- Inter : repli des appareils sans SF Pro (sur iPhone, -apple-system passe avant et ces fichiers ne servent pas) -->
  <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>

    <div class="launch-slow"><div class="rail indet"><i></i></div><div class="m"></div></div>
  </div>
  <!-- tout de suite après l'écran de lancement (CSP : aucun script en ligne) : recentre le K, et dit « appareil trop ancien » si app.js ne tourne pas -->

    </header>

    <main id="main-content">
      <!-- vide : l'écran de lancement le couvre (compat.js y écrit si l'appareil est trop ancien) -->
      <div class="boot"></div>
    </main>

    <div id="detail-overlay" class="hidden"></div>

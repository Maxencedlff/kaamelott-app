<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EEE7D7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kaamelott">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Kaamelott</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="mast" id="main-header">
      <span class="brand">Kaamelott</span>
      <span class="mast-sub" id="mast-sub">Répliques</span>
    </header>

    <main id="main-content">
      <div class="loading">Chargement des répliques…</div>
    </main>

    <nav class="tabs" id="bottom-nav">
      <button class="nav-btn active" data-view="citations">Répliques</button>
      <button class="nav-btn" data-view="quiz">Quiz</button>
      <button class="nav-btn" data-view="personnages">Personnages</button>
      <button class="nav-btn" data-view="recherche">Chercher</button>
      <button class="nav-btn" data-view="favoris">Favoris</button>
    </nav>
  </div>

  <div id="detail-overlay" class="hidden"></div>
  <div class="sheet-back" id="sheet-back" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <script src="app.js"></script>
</body>
</html>

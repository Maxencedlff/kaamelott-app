<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Répliques, quiz et personnages de Kaamelott">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kaamelott">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Kaamelott</title>
  <!-- Inter : repli des appareils sans SF Pro (sur iPhone, -apple-system passe avant et ces fichiers ne servent pas) -->
  <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="mast" id="main-header">
      <span class="mast-sub" id="mast-sub">Répliques</span>
      <button class="round" id="mast-set" aria-label="Réglages" hidden><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    </header>

    <main id="main-content">
      <!-- même texte que l'écran de chargement d'app.js : visible avant l'exécution du script (compat.js le remplace si l'appareil est trop ancien) -->
      <div class="boot"><div class="t">Chargement des répliques…</div></div>
    </main>

    <div id="detail-overlay" class="hidden"></div>

    <div class="mini" id="mini" hidden></div>

    <nav class="tabs off" id="bottom-nav" aria-label="Sections">
      <button class="nav-btn active" data-view="citations" aria-current="page" aria-disabled="true"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-quote"/></svg><span>Répliques</span></button>
      <button class="nav-btn" data-view="quiz" aria-disabled="true"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-quiz"/></svg><span>Quiz</span></button>
      <button class="nav-btn" data-view="personnages" aria-disabled="true"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-people"/></svg><span>Personnages</span></button>
      <button class="nav-btn" data-view="recherche" aria-disabled="true"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-search"/></svg><span>Chercher</span></button>
      <button class="nav-btn" data-view="favoris" aria-disabled="true"><svg viewBox="0 0 28 28" aria-hidden="true"><use href="#i-star"/></svg><span>Favoris</span></button>
    </nav>
  </div>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <p id="sr-live" class="sr" aria-live="polite"></p>

  <!-- pictogrammes dessinés au trait, à la manière des SF Symbols -->
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-quote" viewBox="0 0 28 28"><path d="M5 6.5h18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M9 11.5h10M9 15h6.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-quiz" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.7 11.2a3.4 3.4 0 0 1 6.6 1.1c0 2.3-3.3 2.6-3.3 4.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="14" cy="20" r="1.25" fill="currentColor"/></symbol>
      <symbol id="i-people" viewBox="0 0 28 28"><circle cx="11" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 22.5c.6-4 3.6-6.5 7.5-6.5s6.9 2.5 7.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M18.5 6.4a4 4 0 0 1 0 7.3M21 16.4c2 .9 3.2 3 3.5 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 28 28"><circle cx="12.5" cy="12.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M18 18l6 6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 28 28"><path d="M14 3.8l3.1 6.4 7 1-5.1 4.9 1.2 7-6.2-3.3-6.2 3.3 1.2-7L3.9 11.2l7-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-star-f" viewBox="0 0 28 28"><path d="M14 3.8l3.1 6.4 7 1-5.1 4.9 1.2 7-6.2-3.3-6.2 3.3 1.2-7L3.9 11.2l7-1z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 28 28"><path d="M8.5 5.3c0-1 1.1-1.6 2-1.1l13 8.1c.8.5.8 1.7 0 2.2l-13 8.1c-.9.5-2-.1-2-1.1z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 28 28"><rect x="6.5" y="4.5" width="5" height="19" rx="1.4" fill="currentColor"/><rect x="16.5" y="4.5" width="5" height="19" rx="1.4" fill="currentColor"/></symbol>
      <symbol id="i-next" viewBox="0 0 28 28"><path d="M3 7.6c0-.9 1-1.4 1.7-.9l8.3 6.4c.6.5.6 1.4 0 1.8l-8.3 6.4c-.7.5-1.7 0-1.7-.9zM14 7.6c0-.9 1-1.4 1.7-.9l8.3 6.4c.6.5.6 1.4 0 1.8l-8.3 6.4c-.7.5-1.7 0-1.7-.9z" fill="currentColor"/></symbol>
      <symbol id="i-prev" viewBox="0 0 28 28"><path d="M25 7.6c0-.9-1-1.4-1.7-.9L15 13.1c-.6.5-.6 1.4 0 1.8l8.3 6.4c.7.5 1.7 0 1.7-.9zM14 7.6c0-.9-1-1.4-1.7-.9L4 13.1c-.6.5-.6 1.4 0 1.8l8.3 6.4c.7.5 1.7 0 1.7-.9z" fill="currentColor"/></symbol>
      <symbol id="i-replay" viewBox="0 0 28 28"><path d="M6.2 15.5a8 8 0 1 0 2.4-6.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6.4 4.6v5.2h5.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 28 28"><path d="M3.5 8.5h3.6c2 0 3.2.9 4.3 2.6l5.2 7.8c1.1 1.7 2.3 2.6 4.3 2.6h3.6M3.5 21.5h3.6c2 0 3.2-.9 4.3-2.6M16.6 9.1c1.1-1.7 2.3-2.6 4.3-2.6h3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M21.5 3.5l3 3-3 3M21.5 18.5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-film" viewBox="0 0 28 28"><rect x="3" y="6" width="22" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 10.6v6.8l5.6-3.4z" fill="currentColor"/></symbol>
      <symbol id="i-share" viewBox="0 0 28 28"><path d="M14 3.5v14M9.5 8 14 3.5 18.5 8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11.5H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 28 28"><path d="M4.5 8h11M20.5 8h3M4.5 14h3M12.5 14h11M4.5 20h9M18.5 20h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="18" cy="8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="10" cy="14" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="16" cy="20" r="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
      <symbol id="i-chev" viewBox="0 0 28 28"><path d="M11 6.5 18.5 14 11 21.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 28 28"><path d="M17 5.5 8.5 14l8.5 8.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 28 28"><path d="M6 14.5l5 5L22.5 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 28 28"><path d="M8 8l12 12M20 8 8 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-cal" viewBox="0 0 28 28"><rect x="4" y="6" width="20" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4 11.5h20M9.5 3.5v4.5M18.5 3.5v4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
      <symbol id="i-offline" viewBox="0 0 28 28"><path d="M4 11.2a14.5 14.5 0 0 1 20 0M7.6 15a9.4 9.4 0 0 1 12.8 0M11.2 18.7a4.4 4.4 0 0 1 5.6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 4.5l18 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-warn" viewBox="0 0 28 28"><path d="M14 4.5 25 23.5H3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 11v5.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="14" cy="20" r="1.3" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <script src="compat.js"></script>
  <script src="app.js"></script>
</body>
</html>

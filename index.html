<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EEE7D7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Répliques, quiz et personnages de Kaamelott">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kaamelott">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Kaamelott</title>
  <link rel="preload" href="fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ebgaramond-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="mast" id="main-header">
      <span class="brand">Kaamelott</span>
      <span class="mast-sub" id="mast-sub">Répliques</span>
    </header>

    <main id="main-content">
      <!-- même texte que l'écran de chargement d'app.js : visible avant l'exécution du script (compat.js le remplace si l'appareil est trop ancien) -->
      <div class="boot"><div class="t">Chargement des répliques…</div></div>
    </main>

    <nav class="tabs off" id="bottom-nav" aria-label="Sections">
      <button class="nav-btn active" data-view="citations" aria-current="page" aria-disabled="true">Répliques</button>
      <button class="nav-btn" data-view="quiz" aria-disabled="true">Quiz</button>
      <button class="nav-btn" data-view="personnages" aria-disabled="true">Personnages</button>
      <button class="nav-btn" data-view="recherche" aria-disabled="true">Chercher</button>
      <button class="nav-btn" data-view="favoris" aria-disabled="true">Favoris</button>
    </nav>
  </div>

  <div id="detail-overlay" class="hidden"></div>
  <div class="sheet-back" id="sheet-back" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <p id="sr-live" class="sr" aria-live="polite"></p>

  <script src="compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
